name: Release

# Pushing a vX.Y.Z tag builds a universal DMG and attaches it to a GitHub
# Release. The tag is the only source of truth for the bundle version.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Validates the tag before spending minutes on a universal build.
      - name: Resolve version
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag '$TAG' is not a vMAJOR.MINOR.PATCH tag" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build DMG
        run: make release VERSION="$VERSION"

      - name: Checksum
        run: |
          cd dist
          shasum -a 256 "Mic Muter.dmg" > SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            "dist/Mic Muter.dmg" \
            dist/SHA256SUMS \
            --title "Mic Muter $VERSION" \
            --generate-notes \
            --verify-tag
