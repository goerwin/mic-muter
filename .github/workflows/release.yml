name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    runs-on: macos-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        # fetch-depth 0 for release notes; pin ref for dispatch builds.
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Resolve version
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag '$TAG' is not a vMAJOR.MINOR.PATCH tag" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build DMG
        run: make release VERSION="$VERSION"

      - name: Checksum
        run: |
          cd dist
          shasum -a 256 "Mic Muter.dmg" > SHA256SUMS

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          notes=$(Scripts/release-notes.sh "$TAG")
          gh release create "$TAG" \
            "dist/Mic Muter.dmg" \
            dist/SHA256SUMS \
            --title "$TAG" \
            --notes "$notes" \
            --verify-tag
