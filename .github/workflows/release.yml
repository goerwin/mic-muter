name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # Shares CI's group so a tag release cancels CI for the same commit.
  group: mac-${{ github.sha }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: macos-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      DEVELOPMENT_TEAM: PCZ58H68H5
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        # fetch-depth 0 for release notes; pin ref for dispatch builds.
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Resolve version
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag '$TAG' is not a vMAJOR.MINOR.PATCH tag" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Install signing certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.MAC_BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.MAC_BUILD_CERTIFICATE_BASE64_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.MAC_BUILD_CERTIFICATE_BASE64_PASSWORD }}
          APP_CERTIFICATE: ${{ secrets.MAC_APP_CERTIFICATE }}
        run: |
          set -euo pipefail
          for name in BUILD_CERTIFICATE_BASE64 P12_PASSWORD KEYCHAIN_PASSWORD APP_CERTIFICATE; do
            [[ -n "${!name}" ]] || { echo "$name is required" >&2; exit 1; }
          done

          keychain="$RUNNER_TEMP/app-signing.keychain-db"
          certificate="$RUNNER_TEMP/certificate.p12"
          trap 'rm -f "$certificate"' EXIT
          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$certificate"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$certificate" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$keychain"
          security list-keychain -d user -s "$keychain"

      - name: Build DMG
        env:
          APP_CERTIFICATE: ${{ secrets.MAC_APP_CERTIFICATE }}
        run: make release VERSION="$VERSION" CODE_SIGNING_IDENTITY="$APP_CERTIFICATE" CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM"

      - name: Checksum
        run: |
          cd dist
          shasum -a 256 "MicMuter-$VERSION.dmg" > "MicMuter-$VERSION-SHA256SUMS"

      - name: Prepare update feed
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          name="MicMuter-$VERSION"
          [[ -n "$SPARKLE_PRIVATE_KEY" ]] || { echo "SPARKLE_PRIVATE_KEY is required to sign appcast.xml" >&2; exit 1; }
          Scripts/release-notes.sh "$TAG" > "dist/$name.md"

          appcast_tool=".build/SourcePackages/artifacts/sparkle/Sparkle/bin/generate_appcast"
          [[ -x "$appcast_tool" ]] || { echo "Sparkle generate_appcast was not built" >&2; exit 1; }
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$appcast_tool" \
            --ed-key-file - --embed-release-notes \
            --download-url-prefix "$REPO_URL/releases/download/$TAG/" \
            --link "$REPO_URL" \
            dist

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets=(
            "dist/MicMuter-$VERSION.dmg"
            "dist/MicMuter-$VERSION-SHA256SUMS"
            dist/appcast.xml
          )
          notes="dist/MicMuter-$VERSION.md"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
            gh release edit "$TAG" --title "$TAG" --notes-file "$notes"
          else
            gh release create "$TAG" "${assets[@]}" \
              --title "$TAG" \
              --notes-file "$notes" \
              --verify-tag
          fi
