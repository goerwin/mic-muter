name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # Shared with release.yml, which cancels CI when it builds the same commit.
  group: mac-${{ github.sha }}

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Build app
        run: make build
