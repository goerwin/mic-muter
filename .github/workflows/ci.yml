name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

concurrency:
  # Shared group so release run cancels prior CI run.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Build app
        run: make build

      - name: Package DMG
        run: make release VERSION=0.0.0-ci
