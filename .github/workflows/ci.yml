name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      # `make test` only covers the MicMuterState SwiftPM target. Without this
      # the app target is never compiled in CI, so a broken build can merge.
      - name: Build app
        run: make build

      # Catches a missing or unresolved version, the most likely CI-only failure.
      - name: Package DMG
        run: make release VERSION=0.0.0-ci
